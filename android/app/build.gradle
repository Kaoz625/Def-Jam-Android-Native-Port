plugins {
    id "com.android.application"
}

def vendor = file("../vendor")
// [android] Bound parallel compiles inside the CMake build (each lifted file takes GBs of
// RAM): android/dell-build.sh passes -PdefjamNativeJobs; unset keeps Ninja's default.
def defjamCmakeArgs = ["-DANDROID_STL=c++_shared", "-DDEFJAM_BUILD_GAME=ON"]
if (project.findProperty("defjamNativeJobs")) {
    defjamCmakeArgs += ["-DCMAKE_JOB_POOLS=compile=" + project.findProperty("defjamNativeJobs"),
                        "-DCMAKE_JOB_POOL_COMPILE=compile"]
}

android {
    namespace "org.defjamffny.android"
    compileSdk 34
    lint { checkReleaseBuilds false; abortOnError false }
    ndkVersion project.findProperty("defjamNdkVersion") ?: "28.2.13676358"

    defaultConfig {
        applicationId "org.defjamffny.android"
        minSdk 29
        targetSdk 34
        versionCode 149
        versionName "1.4-up1.1.2"
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake {
                arguments(*defjamCmakeArgs)
                cFlags "-O2"
                cppFlags "-O2"
                targets "main", "SDL3-shared", "main_hook", "hook_impl", "defjam_fg34", "defjam_lsfg27"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            externalNativeBuild { cmake { arguments "-DCMAKE_BUILD_TYPE=RelWithDebInfo" } }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            externalNativeBuild { cmake { arguments "-DCMAKE_BUILD_TYPE=Release" } }
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.31.6"
        }
    }

    sourceSets {
        main {
            java.srcDirs += new File(vendor, "SDL/android-project/app/src/main/java")
        }
    }

    packaging {
        jniLibs {
            // AdrenoTools needs the hook libraries extracted on disk so it can
            // build an isolated linker namespace around the selected driver.
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Keep both interface languages readable on Windows build hosts.
tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
